scenarios:
  - name: "Create Nicepay VA Transaction History - defaults"
    steps:
      - step: "Create a notification record directly (mirrors what the webhook controller does on receipt)"
        action: "create"
        model: "nicepay_va_transaction_history"
        save_as: "notif"
        values:
          name: "TXN-YAML-1"
          code: "/"
          payload: '{"tXid": "TXN-YAML-1", "billingNm": "Yaml Test Partner", "amt": "10000", "transDt": "20260724", "bankCd": "014"}'

      - step: "Assert defaults applied"
        action: "assert"
        target: "notif"
        asserts:
          state:
            type: "value"
            expected: "draft"
          active:
            type: "value"
            expected: true
          error_message:
            type: "value"
            expected: false
          payment_id:
            type: "m2o"
            expected: false
          processed_date:
            type: "value"
            expected: false

  - name: "Internal user without group_system can only read, not create/write/unlink"
    steps:
      - step: "Create restricted user (base.group_user only)"
        action: "create"
        model: "res.users"
        save_as: "plain_user"
        values:
          name: "Nicepay Notification Plain User"
          login: "nicepay_notification_plain_user"
          groups_id:
            - - 6
              - 0
              - - "REF: base.group_user"

      - step: "Create a notification as admin (baseline data)"
        action: "create"
        model: "nicepay_va_transaction_history"
        as_user: "base.user_admin"
        save_as: "notif"
        values:
          name: "TXN-YAML-2"
          code: "/"
          payload: '{"tXid": "TXN-YAML-2"}'

      - step: "Plain user can read the notification"
        action: "call"
        target: "notif"
        method: "read"
        as_user: "plain_user"

      - step: "Plain user cannot create a notification"
        action: "create"
        model: "nicepay_va_transaction_history"
        as_user: "plain_user"
        expect_error:
          type: "AccessError"
        values:
          name: "TXN-YAML-3"
          code: "/"
          payload: '{"tXid": "TXN-YAML-3"}'

      - step: "Plain user cannot write the notification"
        action: "write"
        target: "notif"
        as_user: "plain_user"
        expect_error:
          type: "AccessError"
        values:
          note: "hack"

      - step: "Plain user cannot unlink the notification"
        action: "call"
        target: "notif"
        method: "unlink"
        as_user: "plain_user"
        expect_error:
          type: "AccessError"

  - name: "Administration (base.group_system) user has full CRUD access"
    steps:
      - step: "Create notification as admin"
        action: "create"
        model: "nicepay_va_transaction_history"
        as_user: "base.user_admin"
        save_as: "notif"
        values:
          name: "TXN-YAML-4"
          code: "/"
          payload: '{"tXid": "TXN-YAML-4"}'

      - step: "Admin can write"
        action: "write"
        target: "notif"
        as_user: "base.user_admin"
        values:
          note: "updated by admin"

      - step: "Assert write applied"
        action: "assert"
        target: "notif"
        refresh: true
        asserts:
          note:
            type: "value"
            expected: "updated by admin"

      - step: "Admin can unlink"
        action: "call"
        target: "notif"
        method: "unlink"
        as_user: "base.user_admin"

      - step: "Assert record no longer searchable"
        action: "search"
        model: "nicepay_va_transaction_history"
        domain:
          - ["name", "=", "TXN-YAML-4"]
        save_as: "deleted_search"
        expect_count: 0
